# FoodLens default configuration. Single source of truth for paths, thresholds and parameters.
# Loaded and validated by foodlens.config.load_config(). Relative paths are relative to the repo root.
# Pixel values are 0-255 (uint8). Times are in seconds unless the key says _h (hours).

paths:
  raw_dir: experiment        # raw sessions, read-only, never modified
  data_dir: data             # derived data (gitignored): interim/, processed/, cache/
  reports_dir: reports       # figures/, tables/, metrics/
  models_dir: models         # trained models (gitignored except model cards)
  samples_file: configs/samples.yaml

seed: 42                     # global RNG seed (numpy, sklearn, bootstrap)
n_jobs: -1                   # joblib workers; -1 = all cores

location:                    # capture site, used for the weather-archive temperature lookup
  lat: 30.765
  lon: 76.786
  tz: Asia/Kolkata

capture:
  light_order: [RED, GREEN, BLUE]   # LED cycle; schedule_light = light_order[seq_idx % len]
  image_exts: [.jpg, .jpeg, .png]   # matched case-insensitively
  ignore_dir_substr: _sorted        # folders whose name contains this are skipped (case-insensitive)
  experiment_pattern: 'EXP-\d+'     # first path part matching -> experiment (EXP-1)
  session_pattern: 'exp\d+_D\d+[A-Z]'  # folder name matching -> session_id (exp1_D1A)
  filename_time_pattern: 'IMG_(\d{8}_\d{6})'  # fallback capture time from the file name
  filename_time_format: '%Y%m%d_%H%M%S'

temperature:
  archive_url: https://archive-api.open-meteo.com/v1/archive  # hourly temperature_2m, rh_2m
  timeout_s: 20              # network timeout per request (s)
  retries: 2                 # extra attempts after the first failure
  cache_subdir: cache/weather  # under paths.data_dir; JSON per lat/lon/date range

qc:
  dark_p95: 3.0              # p95 of the max channel below this -> DARK frame (LED off)
  min_signal: 8.0            # pixels with max channel above this count as lit
  dominance_ratio: 0.6       # dominant channel share of lit-pixel mean needed to accept the light
  scene_z: 6.0               # |robust z| of ROI area/centroid/global mean above this -> SCENE_CHANGE
  blur_div: 3.0              # Laplacian variance (inside the session ROI) < (session-light p5 / blur_div) -> BLUR warning
  scene_window: 9            # centred rolling-median window (frames, per session x light) for the scene z:
                             # a local median follows slow trends and persistent steps (D2A +30 % at 13:00, S05)
  scene_floor_log_area: 0.03 # MAD floor of log(per-frame ROI area fraction) (~3 %); raw MADs are ~0.5 %, so
                             # without floors |z| > 6 flags sub-percent jitter (S05)
  scene_floor_px: 2.0        # MAD floor of the per-frame ROI centroid (px at work resolution); raw MAD ~0.5 px
  scene_floor_log_mean: 0.02 # MAD floor of log(lit-channel global mean) (~2 %)
  step_k: 3                  # frames per light compared before/after a candidate scene step
  step_min_log: 0.1          # |log shift| of the lit-channel global mean >= this (~10 %) -> persistent scene step
                             # (only the D2A 13:00 step qualifies; D1A/D3A shifts are 2-4 %, S05)
  step_merge_s: 300          # steps found in different lights within this many seconds = one session step

roi:
  blur_sigma: 2.0            # Gaussian sigma (px at work resolution) before Otsu
  otsu_classes: 3            # multi-Otsu classes; the LOWEST threshold separates meat from the dark
                             # box. Plain 2-class Otsu kept only the brightly lit half of the meat (S04)
  min_level: 8.0             # threshold floor (0-255), = qc.min_signal; guards against Otsu splitting noise
  ref_lights: [RED]          # lights whose per-frame masks build the session ROI (RED IoU 0.90-0.98 vs
                             # reference; GREEN/BLUE masks leak into the lit tray/holder, S04)
  close_r: 7                 # morphological close disk radius (px)
  open_r: 5                  # morphological open disk radius (px)
  min_frac: 0.03             # minimum ROI area as a fraction of the frame
  max_frac: 0.8              # maximum ROI area as a fraction of the frame
  erode_px: 6                # erosion to drop edges / shadow rim (px)
  min_iou: 0.6               # mask IoU vs session median mask below this -> flag
  foreign_max_blue_red: 1.0  # session-median BLUE/RED above this = non-meat material (holder/tray);
                             # meat is 0.3-0.45 (S04). Only regions touching the ROI edge are removed
  foreign_min_area_px: 50    # ignore smaller edge regions (px at work resolution)
  foreign_max_frames: 15     # evenly spaced RED / BLUE frames per session for the median images

glint:                       # glints = specular reflections of surface moisture (NOT bacteria)
  tophat_r: 9                # white top-hat disk radius (px at glint resolution)
  k: 6.0                     # threshold = ROI median + k * MAD
  abs_min: 40                # and at least this absolute value (0-255)
  min_area_px: 3             # minimum connected-component area (px)
  match_px: 6.0              # centroid distance for matching glints between frames (px, EDA only)
  merge_area_ratio: 1.5      # merge/split: merged glint area >= this x the largest part (EDA only)
  sat_level: 250             # pixel value (0-255) counted as saturated inside a glint (JPEG rarely hits 255)
  rel_k: 0.75                # relative glint rule (EDA variant, open question 7): top-hat >= rel_k x local surface
                             # level (opening), i.e. >= 1.75 x the surrounding meat. Chosen (S06) so the RED median count
                             # on 15 QA frames (79) is close to the abs_min rule (100); no time/labels used
  rel_floor: 6.0             # noise floor of the relative rule (0-255): JPEG/sensor noise at dim BLUE levels

vision:
  work_long_side: 1024       # long side (px) for ROI and colour features
  glint_long_side: 2048      # long side (px) for glint statistics
  glcm_distances: [1, 3]     # GLCM pixel distances
  glcm_levels: 32            # GLCM grey levels
  glcm_clip_pct: [1.0, 99.0] # GLCM quantisation range = these ROI percentiles (brightness-independent texture)
  lbp_p: 8                   # LBP neighbours
  lbp_r: 1                   # LBP radius (px)

qa:                          # visual QA contact sheets (`foodlens eda-sheets`, P2.T5)
  positions: [0.0, 0.25, 0.5, 0.75, 1.0]  # fractions of each session x light's usable frames (start..end)
  crop_margin: 0.25          # crop = session-ROI bbox + this fraction of its size per side (shows holder/tray)
  marker_px: 9.0             # radius (px at glint resolution) of the cyan glint-centroid circles
  dpi: 150                   # PNG dpi of the sheets (git-tracked; 300 dpi gave 3.5 MB per sheet)

eda:                         # exploratory analysis (P3: `foodlens eda-stats`, `foodlens eda`)
  shadow_min_level: 8.0      # smoothed RED session-median level (0-255) above which pixels joined to the lit ROI are
                             # (shadowed) meat. S06 probe: box background p50 0.1-1.0, shadowed meat 8-20
  shadow_open_r: 12          # opening disk radius (px, work resolution) that cuts thin lit tray/glass strips (S06)
  positions: [0.0, 0.5, 1.0] # start / middle / end = fractions of each session x light's usable frames (F6)
  stretch_pct: [1.0, 99.5]   # ONE contrast stretch for the 3 frames = these percentiles of their pooled ROI pixels
  diff_pct: 99.0             # colour range of the end - start image = +/- this percentile of |diff| in the ROI
  rel_base_n: 3              # relative-to-first = value / median of the first n frames (the mentor's first = 1.0;
                             # n = 3 so one noisy first frame does not rescale the whole series)
  rolling_window: 5          # centred rolling median (frames) in the time series (F5)
  min_frames: 8              # fewer usable frames in a session x light -> no trend statistic (NaN)
  alpha: 0.05                # significance level used for "clear trend" labels
  window_frac: 0.1           # glint size histograms use the frames in the first / middle / last 10 % of the time
  promising_min_sessions: 4  # P3.T5: "promising" = same trend sign in >= this many sessions
  sample_outliers: 8         # visual review sample (`foodlens eda-sample`): this many trend outliers, plus one
                             # random frame per session x time third and the W_BLUR / after-step frames
  outlier_floor: 0.05        # MAD floor (fraction) of the relative residual in the outlier score (S06: raw MADs
                             # of smooth series are ~0.2 %, which made ordinary frames look like z > 100)
  ref_gap_px: 20             # reference region (lit tray/holder/walls, S06 LED-drift control) starts this many px
                             # (work resolution) outside the full-meat mask (meat drifts <= ~23 px, D2B)
  ref_min_level: 12.0        # ... and is brighter than this (0-255) in the light's session-median image

triplet:
  max_span_s: 200            # max time span (s) of consecutive R, G, B frames forming one triplet

cv:
  group_col_preference: [piece_id, session_id]  # first fully non-null column is the CV group
  inner_splits: 3            # inner GroupKFold folds for nested tuning
  min_groups_for_tuning: 3   # fewer training groups than this -> fixed default hyper-parameters
  temporal_train_frac: 0.6   # temporal holdout: first 60 % of each session trains, last 40 % tests
  n_bootstrap: 2000          # group bootstrap repetitions for 95 % CIs
  n_permutations: 1000       # grouped permutation test repetitions
  ci_level: 0.95
  ece_bins: 10               # expected calibration error bins

labels:
  # Freshness class definition. MUST be confirmed by the user/mentor (plan/PROGRESS.md open question 3).
  class_definition: B        # A = by storage_day (needs confirmed data); B = by equiv hours at 25 °C
  classes: [fresh, use_soon, spoiled_risk]
  equiv_h_thresholds: [2.0, 4.0]  # definition B: <2 h fresh, 2-4 h use_soon, >=4 h spoiled_risk

thermal:                     # Ratkowsky square-root model: rate ∝ (T - T_min)^2
  T_min: -8.0                # °C, notional minimum growth temperature (verify against refs in P5)
  T_ref: 25.0                # °C, reference temperature for equivalent hours
  indoor_offset_c: 0.0       # °C added to the weather-archive temperature for indoor conditions
